apiVersion: v1
kind: Tool
metadata:
  name: ads
  label:
    en_US: ads
    zh_Hans: ads
  description:
    en_US: "Meta ads for a product, run from chat. Stop rules: action=set (kind=stop with metric and target or control_ad, or kind=spend with amount; scope=product or a campaign id; level=ad|adset|campaign; note=the user's words), rules, remove or revert (rule_id). A campaign is checked every 5 minutes only while a rule covers it; dead ads are paused and reported in the chat. status: what is covered and what was decided; history: the ledger. brief: read or set (text) the ads brief. pause: object_id. get: any Graph read (path, params) on this product's account, pixel or page. post: a Graph write (path, data) within the limits: created PAUSED, launches need stop rules and the product's launch mode, budgets whole dollars and at most 20% on live objects, nothing deleted. ask: hand the user's request (prompt, their words) to the ads agent, which answers in the chat in a few minutes; use it for anything that needs several reads or writes (insights questions, building or editing campaigns)."
    zh_Hans: "Meta ads for a product, run from chat. Stop rules: action=set (kind=stop with metric and target or control_ad, or kind=spend with amount; scope=product or a campaign id; level=ad|adset|campaign; note=the user's words), rules, remove or revert (rule_id). A campaign is checked every 5 minutes only while a rule covers it; dead ads are paused and reported in the chat. status: what is covered and what was decided; history: the ledger. brief: read or set (text) the ads brief. pause: object_id. get: any Graph read (path, params) on this product's account, pixel or page. post: a Graph write (path, data) within the limits: created PAUSED, launches need stop rules and the product's launch mode, budgets whole dollars and at most 20% on live objects, nothing deleted. ask: hand the user's request (prompt, their words) to the ads agent, which answers in the chat in a few minutes; use it for anything that needs several reads or writes (insights questions, building or editing campaigns)."
spec:
  parameters: {"type": "object", "properties": {"product_id": {"type": "string"}, "action": {"type": "string", "enum": ["status", "rules", "history", "get", "post", "pause", "set", "remove", "revert", "brief", "ask"], "default": "status"}, "prompt": {"type": "string", "description": "ask: the user's request, in their own words."}, "path": {"type": "string", "description": "get/post: Graph path, e.g. act_<id>/insights."}, "params": {"type": "object", "description": "get: query parameters."}, "data": {"type": "object", "description": "post: the fields to write."}, "object_id": {"type": "string", "description": "pause: campaign, ad set or ad id."}, "scope": {"type": "string", "description": "set: product (default) or a campaign id."}, "kind": {"type": "string", "enum": ["stop", "spend"]}, "level": {"type": "string", "enum": ["ad", "adset", "campaign"]}, "metric": {"type": "string", "description": "set: the event judged on, e.g. Sign Up, add_to_cart, lead."}, "target": {"type": "number", "description": "set: target cost per event, dollars."}, "control_ad": {"type": "string", "description": "set: judge against this ad's live cost instead."}, "amount": {"type": "number", "description": "set kind=spend: dollars an object may spend."}, "multiple": {"type": "number"}, "confidence": {"type": "number"}, "min_events": {"type": "number"}, "cap_multiple": {"type": "number"}, "veto_metric": {"type": "string"}, "veto_target": {"type": "number"}, "lag_hours": {"type": "number"}, "note": {"type": "string", "description": "set: the user's own words for the rule."}, "rule_id": {"type": "string"}, "text": {"type": "string", "description": "brief: the whole ads brief, replacing what is there."}, "limit": {"type": "integer"}}, "required": ["product_id"], "additionalProperties": false}
  llm_prompt: >-
    Meta ads for the product. When someone says when ads should stop (a cost per sign-up or
    lead, a spend limit), call ads action=set with their words in note, then read the rule back
    exactly as the tool's summary words it. For status, rules or pausing one object, call those
    actions directly. For anything that needs several reads or writes in the ad account (how are
    the ads doing, build or edit a campaign, targeting, budgets, creatives), call ads action=ask
    with their request in prompt, reply in one short line that the answer follows in this chat,
    and stop: the answer arrives as its own message. Never invent ad numbers, ids or results,
    and never claim a change the tool did not make.
execution:
  python:
    path: ads.py
    attr: AdsTool
