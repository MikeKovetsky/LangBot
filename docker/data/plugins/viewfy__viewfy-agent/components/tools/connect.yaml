apiVersion: v1
kind: Tool
metadata:
  name: connect
  label:
    en_US: connect
    zh_Hans: connect
  description:
    en_US: "Start GitHub, X, or Cloudflare OAuth for a product. Returns a URL \u2014 Telegram attaches a Connect button; never paste the URL in chat. After consent they return to Telegram (if linked) or the web app. For GitHub, the founder picks which repos to grant on GitHub's install screen (there is no Settings \u2192 Repository page). Cloudflare requires domain."
    zh_Hans: "Start GitHub, X, or Cloudflare OAuth for a product. Returns a URL \u2014 Telegram attaches a Connect button; never paste the URL in chat. After consent they return to Telegram (if linked) or the web app. For GitHub, the founder picks which repos to grant on GitHub's install screen (there is no Settings \u2192 Repository page). Cloudflare requires domain."
spec:
  parameters: {"type": "object", "properties": {"platform": {"type": "string", "enum": ["github", "x", "cloudflare"]}, "product_id": {"type": "string"}, "domain": {"type": "string", "description": "Required for cloudflare (apex domain)."}, "purpose": {"type": "string", "enum": ["blog", "inbox"], "description": "Cloudflare only: blog path Worker (default) or agent inbox on inbox.<domain>."}}, "required": ["platform", "product_id"], "additionalProperties": false}
  llm_prompt: >-
    Mint an OAuth URL for GitHub, X, or Cloudflare. Telegram attaches a Connect button — do not
    paste the URL. For agent email on the customer domain prefer the inbox tool action=attach
    (or connect cloudflare with purpose=inbox). After they finish, they return to this chat.
execution:
  python:
    path: connect.py
    attr: ConnectTool
