apiVersion: v1
kind: Tool
metadata:
  name: issues
  label:
    en_US: issues
    zh_Hans: issues
  description:
    en_US: "List issues from the latest finished audit. Filter by severity or tier."
    zh_Hans: "List issues from the latest finished audit. Filter by severity or tier."
spec:
  parameters: {"type": "object", "properties": {"product_id": {"type": "string"}, "severity": {"type": "string", "enum": ["high", "medium", "low"]}, "tier": {"type": "integer", "enum": [1, 2, 3]}}, "required": ["product_id"], "additionalProperties": false}
  llm_prompt: >-
    List issues from the latest finished audit. Use only for the linked Viewfy user.
execution:
  python:
    path: issues.py
    attr: IssuesTool
