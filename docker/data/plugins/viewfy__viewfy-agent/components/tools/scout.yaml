apiVersion: v1
kind: Tool
metadata:
  name: scout
  label:
    en_US: scout
    zh_Hans: scout
  description:
    en_US: "Per-channel outreach settings. action=get lists channels with prompt, post_access (full_access | approve_required), and the account's standing (good | warming | limited | blocked | unknown) with its pace line, plus the product-level hunt brief. blocked refuses publish server-side; warming means comments only. action=revise is how a founder changes how the agent writes on a channel: pass their words as `feedback` ('keep it all lowercase', 'stop naming the product') and it is merged into that channel's brief, rewriting the lines it contradicts. Use revise for every wording, tone, length, or disclosure request; never hand-write a whole brief into `prompt`. It applies to future drafts only, not to drafts already awaiting approval. action=set edits one channel: `post_access=full_access` queues drafts without human approve; `approve_required` waits for approve. Prefer post_access; `auto` bool is a legacy synonym (true=full_access). Turning full_access on for a community platform is allowed but risky; the reply carries the warning. action=set with `hunt` and no channel writes the hunt brief \u2014 the founder's own map of where the ICP lives and which thread shapes discovery should chase; it steers thread scouting for all channels. action=set with `telegram_venues` and no channel writes the Telegram watchlist (@usernames). action=set with `blog_venues` and no channel writes the trade-blog feed watchlist (URLs or {host,feed,label,hours} objects; hours default 1). set needs policy scope; revise needs write."
    zh_Hans: "Per-channel outreach settings. action=get lists channels with prompt, post_access (full_access | approve_required), and the account's standing (good | warming | limited | blocked | unknown) with its pace line, plus the product-level hunt brief. blocked refuses publish server-side; warming means comments only. action=revise is how a founder changes how the agent writes on a channel: pass their words as `feedback` ('keep it all lowercase', 'stop naming the product') and it is merged into that channel's brief, rewriting the lines it contradicts. Use revise for every wording, tone, length, or disclosure request; never hand-write a whole brief into `prompt`. It applies to future drafts only, not to drafts already awaiting approval. action=set edits one channel: `post_access=full_access` queues drafts without human approve; `approve_required` waits for approve. Prefer post_access; `auto` bool is a legacy synonym (true=full_access). Turning full_access on for a community platform is allowed but risky; the reply carries the warning. action=set with `hunt` and no channel writes the hunt brief \u2014 the founder's own map of where the ICP lives and which thread shapes discovery should chase; it steers thread scouting for all channels. action=set with `telegram_venues` and no channel writes the Telegram watchlist (@usernames). action=set with `blog_venues` and no channel writes the trade-blog feed watchlist (URLs or {host,feed,label,hours} objects; hours default 1). set needs policy scope; revise needs write."
spec:
  parameters: {"type": "object", "properties": {"product_id": {"type": "string"}, "action": {"type": "string", "enum": ["get", "revise", "set"], "default": "get"}, "channel": {"type": "string", "enum": ["reddit", "hn", "indiehackers", "dev", "producthunt", "peerlist", "quora", "x", "linkedin", "threads", "facebook", "blog_comment", "directory", "sos", "email_reply", "email_outreach"], "description": "Required for revise, and for set except hunt."}, "feedback": {"type": "string", "description": "revise: what to change about the writing, in the founder's own words. Merged into the channel brief, not appended."}, "prompt": {"type": "string", "description": "set: replaces the whole channel brief. Prefer action=revise for anything a founder said in passing."}, "hunt": {"type": "string", "description": "Product-level hunt brief for thread discovery (set without channel). Empty string clears it."}, "telegram_venues": {"type": "array", "items": {"type": "string"}, "description": "Telegram @usernames to watch (set without channel). Empty list clears it."}, "reddit_venues": {"type": "array", "items": {"type": "string"}, "description": "Subreddit watchlist (set without channel). Empty list clears the pin and stops re-guessing."}, "blog_venues": {"type": "array", "items": {"type": "string"}, "description": "Trade-blog feeds to watch (set without channel). Feed URLs, or objects with host/feed/label/hours. Empty list clears it."}, "post_access": {"type": "string", "enum": ["full_access", "approve_required"], "description": "full_access = draft job queues without approve; approve_required = human approve first."}, "auto": {"type": "boolean", "description": "Legacy synonym: true=full_access, false=approve_required."}, "active": {"type": "boolean"}, "daily_cap": {"type": "integer", "description": "Per-channel daily cap override (1-50): ceiling on new candidates per day and pending unapproved drafts."}}, "required": ["product_id"], "additionalProperties": false}
  llm_prompt: >-
    Read or change per-channel scout outreach settings. Use only for the linked Viewfy user.
    When the founder says anything about how the agent should write on a channel (all lowercase,
    keep it shorter, stop naming the product, drop the sign-off), call action=revise with that
    channel and their own words as feedback: it merges the request into the channel's standing
    brief so every future draft follows it. Say it applies to future drafts, not to ones already
    waiting for approval. If it fails, the brief is unchanged, so say that instead of claiming
    the tone was updated. action=set is for post_access and needs the policy scope, which this
    chat does not have; do not offer it.
execution:
  python:
    path: scout.py
    attr: ScoutTool
