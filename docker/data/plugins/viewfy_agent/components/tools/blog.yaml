apiVersion: v1
kind: Tool
metadata:
  name: blog
  label:
    en_US: blog
    zh_Hans: blog
  description:
    en_US: List blog posts for a product, or get one by post_id. Includes Cloudflare/DNS host status.
    zh_Hans: List blog posts for a product, or get one by post_id. Includes Cloudflare/DNS host status.
spec:
  parameters: {"type": "object", "properties": {"product_id": {"type": "string"}, "post_id": {"type": "string"}}, "required": ["product_id"]}
  llm_prompt: List blog posts for a product, or get one by post_id. Response includes host.cloudflare / dns_status — use that before claiming Cloudflare is not connected.
execution:
  python:
    path: blog.py
    attr: BlogTool
