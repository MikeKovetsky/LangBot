apiVersion: v1
kind: Tool
metadata:
  name: roam_queue
  label:
    en_US: roam_queue
    zh_Hans: roam_queue
  description:
    en_US: "The roam ledger: comments and posts on other people's threads, in every state. Default status=draft (waiting for approval). status=posted is the publish history - what actually went out, with permalink and posted_at; call it whenever the founder asks what was posted or published. Posted rows include posts published by the operator, so approve_required channels still accumulate them - never infer 'nothing was posted' from channel policy. Use this when they say approve/reject so you can pick the matching draft and pass its id to roam_approve. Returns action ids for tools only; never show ids in chat. Prefer matching by channel, target title/url, and draft text from the recent conversation."
    zh_Hans: "The roam ledger: comments and posts on other people's threads, in every state. Default status=draft (waiting for approval). status=posted is the publish history - what actually went out, with permalink and posted_at; call it whenever the founder asks what was posted or published. Posted rows include posts published by the operator, so approve_required channels still accumulate them - never infer 'nothing was posted' from channel policy. Use this when they say approve/reject so you can pick the matching draft and pass its id to roam_approve. Returns action ids for tools only; never show ids in chat. Prefer matching by channel, target title/url, and draft text from the recent conversation."
spec:
  parameters: {"type": "object", "properties": {"product_id": {"type": "string", "description": "Optional. Omit to list across all owned products."}, "status": {"type": "string", "description": "Comma-separated: draft, queued, candidate, posted, rejected, failed (default draft; posted = publish history).", "default": "draft"}, "channel": {"type": "string", "description": "Optional channel key filter."}, "days": {"type": "integer", "description": "Optional rolling window, e.g. days=1 for the last 24h, days=7 for the week. Use this for 'how many did we post yesterday' - stats is site traffic, not posts."}, "limit": {"type": "integer", "description": "Max rows (default 10, max 50)."}}, "required": [], "additionalProperties": false}
  llm_prompt: >-
    List pending roam drafts. Use when the founder says approve/reject so you can find the
    matching draft id for roam_approve. Never show action ids in chat.
execution:
  python:
    path: roam_queue.py
    attr: RoamQueueTool
