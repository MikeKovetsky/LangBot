apiVersion: v1
kind: Tool
metadata:
  name: roam_approve
  label:
    en_US: roam_approve
    zh_Hans: roam_approve
  description:
    en_US: Approve or reject a pending roam draft by action id from roam_queue.
    zh_Hans: Approve or reject a pending roam draft by action id from roam_queue.
spec:
  parameters: {"type": "object", "properties": {"action_id": {"type": "string"}, "decision": {"type": "string", "enum": ["approve", "reject"], "default": "approve"}}, "required": ["action_id"]}
  llm_prompt: Approve or reject a pending roam draft. Pass action_id from roam_queue. Never invent ids. Never show action ids in chat.
execution:
  python:
    path: roam_approve.py
    attr: RoamApproveTool
